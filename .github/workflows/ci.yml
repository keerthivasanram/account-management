name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: klarves_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      ENVIRONMENT: development
      PG_URL: postgresql://postgres:postgres@localhost:5432/klarves_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt

      - name: Tests (SQLite)
        run: python -m pytest -q

      - name: Migrations apply cleanly and match the models
        env:
          DATABASE_URL: ${{ env.PG_URL }}
        run: |
          python -m alembic upgrade head
          python -m alembic downgrade 004_catch_up_missing_tables
          python -m alembic upgrade head
          # Fail if the models define tables/columns that no migration creates
          if python -m alembic check 2>&1 | grep -E "Detected (added|removed) (table|column)"; then
            echo "::error::Model/migration drift detected - add an Alembic migration"; exit 1
          fi

      - name: Tests (Postgres)
        env:
          TEST_DATABASE_URL: ${{ env.PG_URL }}
        run: |
          psql "$PG_URL" -c "DROP SCHEMA public CASCADE; CREATE SCHEMA public;"
          python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
